<!DOCTYPE html>
<html>
<head>
    <title>Form for servlet</title>
    <style>
body {
    font-family: serif;
    background-color: white;
    margin: 0;
    display: flex;
    justify-content: center;   
    align-items: flex-start;  
    height: 100vh;
    padding-top: 40px;        
}

        .container {
            width: 520px;
            margin: 40px;
            border: 3px solid black;
            padding: 20px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 6px 4px;
            vertical-align: middle;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 280px;
            padding: 6px;
            border: 2px solid #888;
            font-size: 18px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 6px;
        }

        .buttons {
            padding-top: 10px;
        }

        input[type="submit"],
        input[type="reset"] {
            font-size: 20px;
            padding: 6px 14px;
            border: 2px solid black;
            background-color: #eee;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <form>
        <table>
            <tr>
                <td>name</td>
                <td><input type="text" placeholder="enter your name"></td>
            </tr>

            <tr>
                <td>email</td>
                <td><input type="email" placeholder="enter your gmail"></td>
            </tr>

            <tr>
                <td>password</td>
                <td><input type="password" placeholder="enter your password"></td>
            </tr>

            <tr>
                <td>select gender</td>
                <td>
                    <input type="radio" name="gender">Male
                    <input type="radio" name="gender">Female
                </td>
            </tr>

            <tr>
                <td>course</td>
                <td>
                    <input type="checkbox">Java
                    <input type="checkbox">Python
                    <input type="checkbox">JavaScript
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="checkbox">
                    accept term and condition
                </td>
            </tr>

            <tr>
                <td></td>
                <td class="buttons">
                    <input type="submit" value="submit">
                    <input type="reset" value="reset">
                </td>
            </tr>

        </table>
    </form>
</div>

</body>
</html>
