<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout Demo</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:20px;color:#222}
    h1{margin-bottom:8px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:120px;gap:12px}
    .box{background:#f7f7f7;border:1px solid #e0e0e0;padding:8px;display:flex;align-items:center;justify-content:center}
    .image-placeholder{width:100%;height:100%;border:2px dashed #bbb;display:flex;align-items:center;justify-content:center;color:#666;flex-direction:column}
    .image-placeholder img{max-width:100%;max-height:100%;object-fit:contain}
    .span-2{grid-column:span 2}
    .span-3{grid-column:span 3}
    .row-span-2{grid-row:span 2}
    .help{font-size:13px;color:#555;margin-bottom:10px}
    input[type=file]{display:block}
  </style>
</head>
<body>
  <h1>Basic Grid Layout</h1>
  <p class="help">Click the placeholder to choose an image, or replace it later in the markup. Demonstrates rows, column spans and row spans.</p>

  <div class="grid">
    <div class="box span-2 row-span-2">
      <div class="image-placeholder" id="imgArea">Image placeholder
        <small style="margin-top:6px">click to insert image</small>
      </div>
    </div>

    <div class="box">Box A</div>
    <div class="box">Box B</div>

    <div class="box span-3">Wide box (colspan=3)</div>

    <div class="box">Box C</div>
    <div class="box">Box D</div>
    <div class="box">Box E</div>
  </div>

  <input type="file" id="fileInput" accept="image/*">

  <script>
    const imgArea = document.getElementById('imgArea');
    const fileInput = document.getElementById('fileInput');
    imgArea.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.onload = ()=> URL.revokeObjectURL(img.src);
      imgArea.innerHTML = '';
      imgArea.style.border = 'none';
      imgArea.appendChild(img);
    });
  </script>
</body>
</html>
